[project]
name = "nexora-engine"
version = "0.1.0"
description = "Scalable Django starter project for Nexora Engine"
requires-python = ">=3.10"
dependencies = [
  "Django>=5.2,<5.3",
  "celery>=5.6,<6.0",
  "python-dotenv>=1.0,<2.0",
  "djangorestframework",
  "drf-spectacular",
  "psycopg[binary]",
  "django-cors-headers",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    .git
  | .venv
  | venv
  | __pycache__
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "core"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["apps", "config", "core"]
skip = ["migrations", ".venv", "venv"]
