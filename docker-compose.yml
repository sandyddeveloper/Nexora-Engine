services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexora-engine

    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120

    env_file:
      - .env

    volumes:
      - .:/app
      - ../../infrastructure/volumes/static:/app/staticfiles

    ports:
      - "8000:8000"

    restart: unless-stopped

    networks:
      - nexora-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexora-celery-worker

    command: celery -A config worker --loglevel=info

    env_file:
      - .env

    volumes:
      - .:/app

    restart: unless-stopped

    depends_on:
      - web

    networks:
      - nexora-network

  flower:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexora-flower

    command: >
      celery -A config flower
      --port=5555
      --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}

    env_file:
      - .env

    volumes:
      - .:/app

    ports:
      - "5555:5555"

    restart: unless-stopped

    networks:
      - nexora-network

networks:
  nexora-network:
    external: true
    name: nexora-infra_nexora-network
